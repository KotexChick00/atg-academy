spring.application.name=demo
server.forward-headers-strategy=framework

# ============================
# Cấu hình MySQL Database
# ============================
# Đã bổ sung allowPublicKeyRetrieval=true ở cuối cùng
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aov_tactics?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# Cấu hình JPA & Hibernate
# ============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================
# Bao mat Google JWT
# ============================
app.security.google-client-id=${APP_SECURITY_GOOGLE_CLIENT_ID:422848404584-2r1fgoo4uh06p10fbskvtrapvr0pgh28.apps.googleusercontent.com}
app.security.admin-emails=${APP_SECURITY_ADMIN_EMAILS:hoangminhtung.2482005@gmail.com}
app.security.staff-emails=${APP_SECURITY_STAFF_EMAILS:}

# ============================
# CORS — Danh sách domain được phép gọi API
# (Ngrok, localhost dev, v.v.)
# ============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://frigidly-attribute-step.ngrok-free.dev,http://localhost:8080}
